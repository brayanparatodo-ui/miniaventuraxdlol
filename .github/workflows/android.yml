name: Compilar Miniaventura APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependencias Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip wget \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev automake

      - name: Instalar herramientas Android
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O /tmp/android-tools.zip

          mkdir -p /tmp/android-tools
          unzip -q /tmp/android-tools.zip -d /tmp/android-tools

          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"

          cp -a /tmp/android-tools/cmdline-tools/. \
            "$ANDROID_HOME/cmdline-tools/latest/"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" --licenses || true

      - name: Instalar paquetes Android
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --sdk_root="$ANDROID_HOME" \
            --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

      - name: Comprobar AIDL
        run: |
          AIDL="$ANDROID_HOME/build-tools/33.0.2/aidl"

          if [ ! -x "$AIDL" ]; then
            echo "ERROR: AIDL no se encontró."
            find "$ANDROID_HOME/build-tools" -name aidl -type f || true
            exit 1
          fi

          echo "AIDL encontrado:"
          "$AIDL" --version

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.34

      - name: Compilar APK
        run: |
          buildozer -v android debug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Miniaventura-APK
          path: bin/*.apk
          if-no-files-found: error
